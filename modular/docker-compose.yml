version: '3.8'

services:
  telecom-app:
    build: .
    ports:
      - "8502:8501"  # Use different port than original app
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - APP_ENV=production
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=100
    restart: unless-stopped